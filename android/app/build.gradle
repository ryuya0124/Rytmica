plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystorePath != null &&
    !releaseKeystorePath.isBlank() &&
    releaseKeystorePassword != null &&
    !releaseKeystorePassword.isBlank() &&
    releaseKeyAlias != null &&
    !releaseKeyAlias.isBlank() &&
    releaseKeyPassword != null &&
    !releaseKeyPassword.isBlank() &&
    rootProject.file(releaseKeystorePath).exists()
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

if (releaseBuildRequested && !hasReleaseSigning) {
    throw new GradleException(
        "Release signing is required. Set ANDROID_KEYSTORE_PATH, " +
        "ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
    )
}

android {
    namespace = "net.ryuya_dev.mnc"
    // Android 17 (API 37). Keep this explicit so CI and local builds target the
    // same platform even when the Flutter SDK default changes.
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "net.ryuya_dev.mnc"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = 37
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // サポートする言語を指定（OS設定画面での言語選択を有効化）
        resConfigs "en", "ja"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = rootProject.file(releaseKeystorePath)
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Keep development installs alongside the GitHub/App Store build,
            // whose persistent release signature must never be replaced.
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-dev"
        }
        release {
            // Never silently publish a debug-signed build. Release tasks fail
            // above when the persistent Rytmica key is unavailable.
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
