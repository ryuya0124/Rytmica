name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag
        required: true
        default: 2.4.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5
  RELEASE_VERSION: 2.4.0

jobs:
  build-android:
    name: Android 17 APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Android 17 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"'

      - name: Restore Android release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: base64 --decode <<< "$KEYSTORE_BASE64" > android/app/rytmica-release.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: app/rytmica-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Prepare Android assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/Rytmica-Android-${RELEASE_VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-assets/Rytmica-Android-${RELEASE_VERSION}.aab"

      - name: Upload Android assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/*
          if-no-files-found: error

  build-windows-x64:
    name: Windows x64 portable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Windows 11 26H1 SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "winsdksetup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2376217" -OutFile $installer
          $process = Start-Process $installer -ArgumentList "/features OptionId.DesktopCPPx64 /quiet /norestart" -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) {
            throw "Windows SDK installer failed with exit code $($process.ExitCode)"
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Package Windows portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "release-assets/Rytmica-Windows-x64-${env:RELEASE_VERSION}.zip"

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs:
      - build-android
      - build-windows-x64
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Rytmica ${{ inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Android 17対応APK/AABとWindows x64ポータブル版です。

            - iOS / iPadOS: App Store
            - macOS: App StoreまたはDeveloper ID署名・Apple公証済みDMG
            - Windows: Microsoft Storeまたはこのリリースのポータブル版
            - Android: このリリースのAPK
          files: release-assets/*
