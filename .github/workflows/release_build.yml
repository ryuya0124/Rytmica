name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag
        required: true
        type: string
      submit_to_microsoft_store:
        description: Submit the Windows MSIX to Microsoft Store after the GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5
  RELEASE_VERSION: ${{ inputs.tag }}

jobs:
  build-android:
    name: Android 17 APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Android 17 SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "build-tools;36.1.0"'

      - name: Restore Android release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: base64 --decode <<< "$KEYSTORE_BASE64" > android/app/rytmica-release.jks

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: app/rytmica-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify Android signing identity
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner" \
            scripts/verify_android_signature.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare Android assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/Rytmica-Android-${RELEASE_VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-assets/Rytmica-Android-${RELEASE_VERSION}.aab"

      - name: Upload Android assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/*
          if-no-files-found: error

  build-windows-x64:
    name: Windows x64 portable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Windows 11 26H1 SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "winsdksetup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2376217" -OutFile $installer
          $process = Start-Process $installer -ArgumentList "/features OptionId.DesktopCPPx64 /quiet /norestart" -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) {
            throw "Windows SDK installer failed with exit code $($process.ExitCode)"
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows x64
        run: flutter build windows --release

      - name: Build Microsoft Store MSIX
        run: dart run msix:create --build-windows false

      - name: Package Windows portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "release-assets/Rytmica-Windows-x64-${env:RELEASE_VERSION}.zip"
          $msix = Get-ChildItem -Path build/windows -Filter *.msix -Recurse | Select-Object -First 1
          if (-not $msix) {
            throw "Microsoft Store MSIX was not produced"
          }
          Copy-Item $msix.FullName "release-assets/Rytmica-Microsoft-Store-${env:RELEASE_VERSION}.msix"

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs:
      - build-android
      - build-windows-x64
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Rytmica ${{ inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Android 17対応APK/AABとWindows x64ポータブル版です。

            - iOS / iPadOS: App Store
            - macOS: App StoreまたはDeveloper ID署名・Apple公証済みDMG
            - Windows: Microsoft Storeまたはこのリリースのポータブル版
            - Android: このリリースのAPK
          files: release-assets/*

  publish-microsoft-store:
    name: Submit Windows MSIX to Microsoft Store
    needs: publish
    if: ${{ inputs.submit_to_microsoft_store && inputs.tag != '2.5.0' }}
    runs-on: windows-latest
    environment: microsoft-store

    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Verify Store package identity and release version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_VERSION
          if ($tag -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use major.minor.patch for Store submission: $tag"
          }
          $package = Join-Path $PWD "release-assets/Rytmica-Microsoft-Store-$tag.msix"
          if (-not (Test-Path -LiteralPath $package)) {
            throw "Microsoft Store MSIX not found: $package"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            $entry = $archive.GetEntry('AppxManifest.xml')
            if ($null -eq $entry) { throw 'MSIX has no AppxManifest.xml' }
            $stream = $entry.Open()
            $reader = [System.IO.StreamReader]::new($stream)
            try {
              [xml]$manifest = $reader.ReadToEnd()
            } finally {
              $reader.Dispose()
            }
          } finally {
            $archive.Dispose()
          }
          $identity = $manifest.Package.Identity
          if ($identity.Name -ne 'ryuya.Rytmica' -or
              $identity.Publisher -ne 'CN=2492F63A-A943-4F47-BCBE-6BCFF558B3D9' -or
              $identity.ProcessorArchitecture -ne 'x64') {
            throw 'MSIX identity, publisher, or architecture does not match the existing Store app'
          }
          $packageVersion = [version]$identity.Version
          if ($packageVersion.Major -ne [int]$tag.Split('.')[0] -or
              $packageVersion.Minor -ne [int]$tag.Split('.')[1] -or
              $packageVersion.Build -ne [int]$tag.Split('.')[2]) {
            throw "MSIX version $packageVersion does not match release tag $tag"
          }
          if ($packageVersion -le [version]'2.5.0.0') {
            throw "MSIX version $packageVersion is not newer than the manually submitted 2.5.0.0"
          }
          Write-Host "Verified Store package $($identity.Name) $packageVersion ($($identity.ProcessorArchitecture))"

      - name: Set up Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          foreach ($name in @('AZURE_AD_TENANT_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'AZURE_AD_APPLICATION_SECRET', 'SELLER_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required Microsoft Store secret is missing: $name"
            }
          }
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store CLI authentication failed' }

      - name: Submit MSIX for certification
        shell: pwsh
        run: |
          $package = Join-Path $PWD "release-assets/Rytmica-Microsoft-Store-$env:RELEASE_VERSION.msix"
          msstore publish $package -id 9N7HMK8TN36X
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store submission failed' }
