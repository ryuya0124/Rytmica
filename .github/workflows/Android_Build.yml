name: Flutter Android Build

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: APK signing and distribution
        type: choice
        default: github
        options: [github, fdroid]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest  # AndroidビルドはLinux環境で実行

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # リポジトリをチェックアウト

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Cache Flutter SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          ~/.flutter
        key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.8'

    - name: Install dependencies
      run: flutter pub get --enforce-lockfile

    - name: Install Android SDKs
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-35" "build-tools;37.0.0" "build-tools;36.1.0" "ndk;28.2.13676358"'

    - name: Restore upstream signing key
      if: ${{ inputs.distribution != 'fdroid' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: base64 --decode <<< "$KEYSTORE_BASE64" > android/app/rytmica-release.jks

    - name: Build signed GitHub release
      if: ${{ inputs.distribution != 'fdroid' }}
      env:
        ANDROID_KEYSTORE_PATH: app/rytmica-release.jks
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        flutter build apk --release
        APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner" scripts/verify_android_signature.sh build/app/outputs/flutter-apk/app-release.apk

    - name: Build unsigned F-Droid release
      if: ${{ inputs.distribution == 'fdroid' }}
      env:
        ORG_GRADLE_PROJECT_fdroid: 'true'
      run: |
        flutter build apk --release
        if "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify build/app/outputs/flutter-apk/app-release.apk; then
          echo 'F-Droid package must be unsigned' >&2
          exit 1
        fi
        "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | head -1

    - name: Rename APK file
      run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Rytmica.apk  # APKの名前を変更

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: rytmica-android-${{ inputs.distribution || 'github' }}
        path: build/app/outputs/flutter-apk/Rytmica.apk  # 変更後のAPKをアップロード
