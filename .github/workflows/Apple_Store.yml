name: App Store status and submission

on:
  workflow_dispatch:
    inputs:
      action:
        description: App Store action
        type: choice
        default: inspect
        options: [inspect, submit]
      platform:
        description: App Store platform
        type: choice
        default: IOS
        options: [IOS, MAC_OS]

permissions:
  contents: read

concurrency:
  group: rytmica-apple-store
  cancel-in-progress: false

jobs:
  app-store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Verify submission guards without network access
        run: ruby test/apple_store_test.rb
      - name: Inspect or submit the current App Store release
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          STORE_ACTION: ${{ inputs.action }}
          STORE_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          ruby scripts/apple_store.rb "$STORE_ACTION" "$STORE_PLATFORM" | tee apple-store-status.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-store-status
          path: apple-store-status.jsonl
